# =============================================================================
# SecondBrainSense — Development Docker Compose
# =============================================================================
# Usage (from repo root):
#   docker compose -f docker/docker-compose.dev.yml up --build
#
# Este stack construye las imagenes desde el codigo fuente (pyproject.toml)
# e incluye hot-reload y herramientas de desarrollo (pgAdmin, OpenTelemetry).
# Es el stack de trabajo para F1, F2, F3...
# Para el stack de referencia SurfSense vanilla usa docker-compose.yml
# =============================================================================

name: secondbrainsense-dev

x-backend-build: &backend-build
  # Contexto en surfsense_backend para que COPY pyproject.toml, COPY . . etc. funcionen.
  # El cert corporativo se inyecta via additional_contexts (no necesita estar en surfsense_backend/).
  context: ../surfsense_backend
  dockerfile: Dockerfile
  additional_contexts:
    repo_root: ..
  args:
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}

x-tests-build: &tests-build
  # Usa el stage unit-tests del Dockerfile: hereda de deps (no de models).
  # Evita descargar EasyOCR, Docling y modelos de embedding (~2GB).
  # Solo instala dependencias Python — ideal para unit tests con mocks.
  # Para tests E2E que necesiten modelos, cambiar target a e2e.
  context: ../surfsense_backend
  dockerfile: Dockerfile
  target: unit-tests
  additional_contexts:
    repo_root: ..
    tests-source: ../surfsense_backend/tests
  args:
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}

x-frontend-build: &frontend-build
  context: ../surfsense_web
  dockerfile: Dockerfile
  additional_contexts:
    repo_root: ..

services:
  db:
    container_name: sbs-dev-db
    image: pgvector/pgvector:pg17
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    environment:
      - POSTGRES_USER=${DB_USER:-surfsense}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-surfsense}
      - POSTGRES_DB=${DB_NAME:-surfsense}
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-surfsense} -d ${DB_NAME:-surfsense}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Short-lived schema runner; see docker/docker-compose.yml `migrations`
  # service for the full rationale. Builds from the same backend context as
  # the dev backend/celery services.
  migrations:
    container_name: sbs-dev-migrations
    build: *backend-build
    volumes:
      - ../netskope-ca-bundle.crt:/certs/corp-root.crt:ro
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${DB_USER:-surfsense}:${DB_PASSWORD:-surfsense}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-surfsense}?ssl=disable}
      - PYTHONPATH=/app
      - SERVICE_ROLE=migrate
      - MIGRATION_TIMEOUT=${MIGRATION_TIMEOUT:-900}
      - SSL_CERT_FILE=/certs/corp-root.crt
      - REQUESTS_CA_BUNDLE=/certs/corp-root.crt
      - CURL_CA_BUNDLE=/certs/corp-root.crt
      - PGSSLMODE=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  pgadmin:
    container_name: sbs-dev-pgadmin
    image: dpage/pgadmin4
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@surfsense.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-surfsense}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  redis:
    container_name: sbs-dev-redis
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-lgtm:
    container_name: sbs-dev-otel
    image: grafana/otel-lgtm:latest
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_GRAFANA_PORT:-3001}:3000"
      - "${OTEL_TEMPO_PORT:-3200}:3200"
    restart: unless-stopped

  searxng:
    container_name: sbs-dev-searxng
    image: searxng/searxng:2026.3.13-3c1f68c59
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-surfsense-searxng-secret}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: sbs-dev-backend
    build: *backend-build
    ports:
      - "${BACKEND_PORT:-8929}:8000"
    volumes:
      - ../surfsense_backend/app:/app/app
      - shared_temp:/shared_tmp
      - ../netskope-ca-bundle.crt:/certs/corp-root.crt:ro
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${DB_USER:-surfsense}:${DB_PASSWORD:-surfsense}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-surfsense}?ssl=disable}
      - CELERY_BROKER_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_APP_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_TASK_DEFAULT_QUEUE=surfsense
      - PYTHONPATH=/app
      - UVICORN_LOOP=asyncio
      - UNSTRUCTURED_HAS_PATCHED_LOOP=1
      - LANGCHAIN_TRACING_V2=false
      - LANGSMITH_TRACING=false
      - AUTH_TYPE=${AUTH_TYPE:-LOCAL}
      - NEXT_FRONTEND_URL=${NEXT_FRONTEND_URL:-http://localhost:3000}
      - SEARXNG_DEFAULT_HOST=${SEARXNG_DEFAULT_HOST:-http://searxng:8080}
      - WHATSAPP_BRIDGE_URL=${WHATSAPP_BRIDGE_URL:-http://whatsapp-bridge:9929}
      - SSL_CERT_FILE=/certs/corp-root.crt
      - REQUESTS_CA_BUNDLE=/certs/corp-root.crt
      - CURL_CA_BUNDLE=/certs/corp-root.crt
      - NODE_EXTRA_CA_CERTS=/certs/corp-root.crt
      - PGSSLMODE=disable
      # Daytona Sandbox - uncomment and set credentials to enable cloud code execution
      # - DAYTONA_SANDBOX_ENABLED=TRUE
      # - DAYTONA_API_KEY=${DAYTONA_API_KEY:-}
      # - DAYTONA_API_URL=${DAYTONA_API_URL:-https://app.daytona.io/api}
      # - DAYTONA_TARGET=${DAYTONA_TARGET:-us}
      - SERVICE_ROLE=api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 200s

  whatsapp-bridge:
    build: ../surfsense_backend/scripts/whatsapp-bridge
    profiles:
      - whatsapp
    ports:
      - "127.0.0.1:${WHATSAPP_BRIDGE_PORT:-9929}:9929"
    volumes:
      - whatsapp_sessions:/data/sessions
    environment:
      - PORT=9929
      - WHATSAPP_MODE=${WHATSAPP_MODE:-self-chat}
      - WHATSAPP_SESSION_DIR=/data/sessions
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9929/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  celery_worker:
    container_name: sbs-dev-celery-worker
    build: *backend-build
    volumes:
      - ../surfsense_backend/app:/app/app
      - shared_temp:/shared_tmp
      - ../netskope-ca-bundle.crt:/certs/corp-root.crt:ro
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${DB_USER:-surfsense}:${DB_PASSWORD:-surfsense}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-surfsense}?ssl=disable}
      - CELERY_BROKER_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_APP_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_TASK_DEFAULT_QUEUE=surfsense
      - PYTHONPATH=/app
      - SEARXNG_DEFAULT_HOST=${SEARXNG_DEFAULT_HOST:-http://searxng:8080}
      - SSL_CERT_FILE=/certs/corp-root.crt
      - REQUESTS_CA_BUNDLE=/certs/corp-root.crt
      - CURL_CA_BUNDLE=/certs/corp-root.crt
      - PGSSLMODE=disable
      - SERVICE_ROLE=worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      backend:
        condition: service_healthy

  celery_beat:
    container_name: sbs-dev-celery-beat
    build: *backend-build
    volumes:
      - ../netskope-ca-bundle.crt:/certs/corp-root.crt:ro
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${DB_USER:-surfsense}:${DB_PASSWORD:-surfsense}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-surfsense}?ssl=disable}
      - CELERY_BROKER_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_TASK_DEFAULT_QUEUE=surfsense
      - PYTHONPATH=/app
      - SSL_CERT_FILE=/certs/corp-root.crt
      - REQUESTS_CA_BUNDLE=/certs/corp-root.crt
      - PGSSLMODE=disable
      - SERVICE_ROLE=beat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      celery_worker:
        condition: service_started

  zero-cache:
    container_name: sbs-dev-zero-cache
    image: rocicorp/zero:1.4.0
    ports:
      - "${ZERO_CACHE_PORT:-4848}:4848"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      - ZERO_UPSTREAM_DB=${ZERO_UPSTREAM_DB:-postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-surfsense}?sslmode=${DB_SSLMODE:-disable}}
      - ZERO_CVR_DB=${ZERO_CVR_DB:-postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-surfsense}?sslmode=${DB_SSLMODE:-disable}}
      - ZERO_CHANGE_DB=${ZERO_CHANGE_DB:-postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-surfsense}?sslmode=${DB_SSLMODE:-disable}}
      - ZERO_REPLICA_FILE=/data/zero.db
      - ZERO_ADMIN_PASSWORD=${ZERO_ADMIN_PASSWORD:-surfsense-zero-admin}
      - ZERO_APP_PUBLICATIONS=${ZERO_APP_PUBLICATIONS:-zero_publication}
      - ZERO_AUTO_RESET=${ZERO_AUTO_RESET:-true}
      - ZERO_NUM_SYNC_WORKERS=${ZERO_NUM_SYNC_WORKERS:-4}
      - ZERO_UPSTREAM_MAX_CONNS=${ZERO_UPSTREAM_MAX_CONNS:-20}
      - ZERO_CVR_MAX_CONNS=${ZERO_CVR_MAX_CONNS:-30}
      - ZERO_QUERY_URL=${ZERO_QUERY_URL:-http://frontend:3000/api/zero/query}
      - ZERO_MUTATE_URL=${ZERO_MUTATE_URL:-http://frontend:3000/api/zero/mutate}
    volumes:
      - zero_cache_data:/data
    restart: unless-stopped
    stop_grace_period: 300s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4848/keepalive"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s

  qdrant:
    container_name: sbs-dev-qdrant
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      # Deshabilita telemetria a telemetry.qdrant.io (falla con Netskope)
      QDRANT__TELEMETRY_DISABLED: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    container_name: sbs-dev-frontend
    build:
      context: ../surfsense_web
      dockerfile: Dockerfile
      additional_contexts:
        repo_root: ..
      args:
        NEXT_PUBLIC_FASTAPI_BACKEND_URL: ${NEXT_PUBLIC_FASTAPI_BACKEND_URL:-http://localhost:8929}
        NEXT_PUBLIC_FASTAPI_BACKEND_AUTH_TYPE: ${NEXT_PUBLIC_FASTAPI_BACKEND_AUTH_TYPE:-LOCAL}
        NEXT_PUBLIC_ETL_SERVICE: ${NEXT_PUBLIC_ETL_SERVICE:-DOCLING}
        NEXT_PUBLIC_ZERO_CACHE_URL: ${NEXT_PUBLIC_ZERO_CACHE_URL:-http://localhost:${ZERO_CACHE_PORT:-5929}}
        NEXT_PUBLIC_DEPLOYMENT_MODE: ${NEXT_PUBLIC_DEPLOYMENT_MODE:-self-hosted}
    ports:
      - "${FRONTEND_PORT:-3929}:3000"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
      zero-cache:
        condition: service_healthy

  # ===========================================================================
  # Servicio de tests — perfil 'tests', no arranca con 'up' normal
  # ===========================================================================
  # Analisis de necesidades por fase:
  #   F1.6 test_pipeline_f1.py  — unit  — solo mocks, sin DB ni Qdrant real
  #   F2.6 test_qdrant_f2.py    — unit  — mock Qdrant client
  #   F4.5 test_router_f4.py    — unit  — mock LLM + mock Qdrant
  #   F4.5 test_crag_evaluator  — unit  — mock LLM
  #   F7.7 test_brain_e2e.py    — e2e   — stack completo + httpx
  #
  # Dependencias instaladas en cada run (no contaminan imagen de produccion):
  #   pytest>=9.0.2       — runner principal
  #   pytest-asyncio      — tests async (F3, F4)
  #   pytest-mock         — fixtures de mock (F2, F4)
  #   pytest-cov          — cobertura >80% (checklist F1.6)
  #   httpx               — cliente HTTP para tests E2E F7.7
  #
  # Uso rapido:
  #   # Unit tests F1 (no necesita stack, solo db+qdrant healthy del perfil tests):
  #   docker compose -f docker/docker-compose.dev.yml --profile tests run --rm tests \
  #     pytest tests/brain/test_pipeline_f1.py -v
  #
  #   # Con cobertura:
  #   docker compose -f docker/docker-compose.dev.yml --profile tests run --rm tests \
  #     pytest tests/brain/ -v --cov=app/brain --cov-report=term-missing
  #
  #   # Suite completa con marcadores:
  #   docker compose -f docker/docker-compose.dev.yml --profile tests run --rm tests \
  #     pytest tests/ -v -m unit
  #
  #   # Tests E2E F7.7 (requiere backend corriendo en host:8929):
  #   docker compose -f docker/docker-compose.dev.yml --profile tests run --rm tests \
  #     pytest tests/integration/test_brain_e2e.py -v
  # ===========================================================================
  tests:
    container_name: sbs-brain-test
    build: *tests-build
    profiles:
      - tests
    volumes:
      # Montar codigo en vivo — cambios visibles sin reconstruir imagen
      - ../surfsense_backend/app:/app/app
      - ../surfsense_backend/tests:/app/tests
      - ../netskope-ca-bundle.crt:/certs/corp-root.crt:ro
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${DB_USER:-surfsense}:${DB_PASSWORD:-surfsense}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-surfsense}?ssl=disable}
      - PYTHONPATH=/app
      - SSL_CERT_FILE=/certs/corp-root.crt
      - REQUESTS_CA_BUNDLE=/certs/corp-root.crt
      - CURL_CA_BUNDLE=/certs/corp-root.crt
      - PGSSLMODE=disable
      # Qdrant — tests de integracion F2-F4
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      # Redis — tests futuros de Celery
      - REDIS_APP_URL=${REDIS_URL:-redis://redis:6379/0}
      # Sin tracing en tests
      - LANGCHAIN_TRACING_V2=false
      - LANGSMITH_TRACING=false
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    # Instalar deps dev en cada run y ejecutar pytest.
    # El script instala pytest y luego lo ejecuta con los argumentos pasados.
    entrypoint:
      - /bin/sh
      - -c
      - |
        pip install --quiet \
          "pytest>=9.0.2" \
          "pytest-asyncio>=1.3.0" \
          "pytest-mock>=3.14" \
          "pytest-cov>=6.0.0" \
          "httpx>=0.28.1" &&
        python -m pytest tests/brain/ -v
    restart: "no"

volumes:
  postgres_data:
    name: secondbrainsense-dev-postgres
  pgadmin_data:
    name: secondbrainsense-dev-pgadmin
  redis_data:
    name: secondbrainsense-dev-redis
  shared_temp:
    name: secondbrainsense-dev-shared-temp
  zero_cache_data:
    name: secondbrainsense-dev-zero-cache
  whatsapp_sessions:
    name: secondbrainsense-dev-whatsapp-sessions
  qdrant_data:
    name: secondbrainsense-dev-qdrant
