services:
  frontend-dev:
    container_name: sbs-debug-frontend
    build:
      context: ../surfsense_web
      dockerfile: Dockerfile
      target: builder
      additional_contexts:
        repo_root: ..
    working_dir: /app
    command: sh -c "pnpm run dev"
    ports:
      - "3002:3000"
    volumes:
      # Certificado corporativo Enagás/Netskope — igual que producción
      - ../netskope-ca-bundle.crt:/certs/corp-root.crt:ro
      # Código fuente montado para hot-reload en desarrollo
      - ../surfsense_web:/app
      # Volúmenes anónimos para aislar node_modules y .next del host:
      # Docker los inicializa desde la imagen (build) y los mantiene en el contenedor,
      # evitando que el mount de /app sobreescriba los paquetes instalados.
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_FASTAPI_BACKEND_URL=http://localhost:8929
      - NEXT_PUBLIC_FASTAPI_BACKEND_AUTH_TYPE=LOCAL
      - NEXT_PUBLIC_ETL_SERVICE=DOCLING
      - NEXT_PUBLIC_ZERO_CACHE_URL=http://localhost:4848
      - NEXT_PUBLIC_DEPLOYMENT_MODE=self-hosted
      - NEXT_TELEMETRY_DISABLED=1
